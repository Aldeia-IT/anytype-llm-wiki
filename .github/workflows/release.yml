name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:           # manual dry-run path (SF-4)
    inputs:
      skip_publish:
        description: "Run audit + build + attest but skip uv publish (dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = full clone so `gitleaks git` can scan the entire commit
      # history (a secret committed then deleted lives only in history).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: false

      # Release-path lockfile gate: tags can be pushed to commits that bypassed the
      # merge-gate, so re-assert lock/manifest consistency here (SF-2). Install-free, ~1s.
      - name: Check lockfile consistency
        run: uv lock --check

      # Audit the SHIPPED surface only (--no-dev). Dev/test deps are audited separately
      # by the weekly audit.yml (--all-extras). See Security Considerations.
      - name: Export lockfile for audit
        # --no-emit-project: exclude the local project itself. uv exports it as an
        # editable `-e .` entry, which pip-audit cannot install under --require-hashes
        # ("no single file to hash"). The audit targets third-party deps only.
        run: uv export --format requirements-txt --no-dev --no-emit-project > /tmp/requirements-audit.txt

      - name: Audit dependencies
        run: uvx pip-audit@2.10.0 -r /tmp/requirements-audit.txt

      # OSS-hygiene scanner suite (fold #244). Tag/audit-gated, each fails on findings.
      # Install the project so pip-licenses can read installed package metadata.
      - name: Install dependencies (frozen, for license scan)
        run: uv sync --frozen --all-extras

      - name: Static analysis (bandit)
        run: uvx bandit==1.9.4 -r src/

      - name: License compatibility (pip-licenses)
        # Fail on copyleft licenses incompatible with the project's MIT license.
        # --partial-match is REQUIRED: without it --fail-on does case-insensitive EXACT
        # set-membership against the SPDX expression / Trove classifier, which never equals
        # the bare token (e.g. "GPL-3.0-only" != "GPL"), so the gate would silently pass a
        # genuinely GPL/AGPL dependency. --partial-match also flags LGPL via "GPL"
        # (acceptable/conservative for an MIT project).
        #
        # PROJECT-SCOPED via `uv run`, NOT `uvx`: `uvx` runs pip-licenses in an isolated
        # ephemeral venv, so it scans only its OWN ~3 deps — never the project tree — making
        # the gate a vacuous no-op that can never catch a real GPL/AGPL dependency. `uv run`
        # runs it against the synced project environment (verified: 85 packages). The
        # `uv sync --frozen --all-extras` step above is what makes that project env available.
        #
        # docutils WAIVER (--ignore-packages docutils): docutils:0.22.4 carries a GPL Trove
        # classifier, but the ONLY GPL-licensed file in the package is an unused Emacs editor
        # config (rst.el); the package itself is public-domain + BSD and is AGPL-clean (which
        # matters for this network-served MCP). The waiver is per-package and auditable; the
        # --fail-on token set is intentionally NOT broadened. Upstream COPYING:
        # https://docutils.sourceforge.io/COPYING.html
        run: uv run --frozen --with pip-licenses==5.5.5 python -m piplicenses --from=mixed --partial-match --fail-on="GPL;AGPL;SSPL;EUPL" --ignore-packages docutils

      - name: Secret scan (gitleaks)
        # `gitleaks git` scans the full commit HISTORY (requires fetch-depth: 0 on checkout);
        # `gitleaks dir` would only see the current working tree and miss secrets that were
        # committed then deleted in a later commit.
        run: |
          # gitleaks' go.mod declares the module path as github.com/zricethezav/gitleaks
          # (the original author's path), even though the repo now lives under the
          # gitleaks org. `go install github.com/gitleaks/...` fails with a module-path
          # mismatch; the zricethezav path is the canonical, documented install form.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --redact --exit-code 1

  # The build job carries NO `environment:` so it never pauses for reviewer
  # approval. Once the maintainer adds required-reviewer protection to the `pypi`
  # Environment (per docs/releasing.md), only the `publish` job below gates on it —
  # so a git-tag-only build (PYPI_PUBLISH_ENABLED unset) still runs green and
  # unattended, attesting provenance without ever waiting for an approval it would
  # never use.
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    needs: audit
    permissions:
      # id-token + attestations are required by attest-build-provenance to mint
      # the signed provenance statement; contents:read for checkout.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: false

      # Re-assert lock consistency on the release path before any build side effect (SF-2).
      - name: Check lockfile consistency
        run: uv lock --check

      # B1 GUARD: abort BEFORE build/attest/publish if the tag does not match the manifest.
      # Skipped on workflow_dispatch (no v* tag to compare against on a manual dry-run).
      - name: Verify tag matches pyproject version
        if: ${{ github.event_name == 'push' }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          proj_version="$(uv version --short)"
          echo "tag=${tag_version}  pyproject=${proj_version}"
          if [ "${tag_version}" != "${proj_version}" ]; then
            echo "::error::Tag v${tag_version} does not match pyproject version ${proj_version}. Aborting before build/publish."
            exit 1
          fi

      # NOTE: no `uv sync` here. `uv build` creates its own isolated build environment and
      # does not need the project synced — keeping it out reduces install surface on this
      # privileged (OIDC/attestation) job (SF-10 / tech SF-3).
      - name: Build distributions
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

      # Hand the built artifacts to the `publish` job. The publish job downloads
      # exactly these files, so PyPI receives the same bytes that were attested.
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # `environment: pypi` gates ONLY this job. When the maintainer adds required
    # reviewers to the Environment, the approval pause lands here — on the job that
    # actually publishes — not on every git-only tag build.
    environment: pypi
    permissions:
      # id-token: write is required for PyPI OIDC trusted publishing (no long-lived
      # token); contents:read for the runner.
      id-token: write
      contents: read
    steps:
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        # Publish is gated on the repo variable PYPI_PUBLISH_ENABLED (Settings →
        # Secrets and variables → Actions → Variables). While it is unset/false,
        # a `v*` tag still runs audit + build + provenance-attest and goes green,
        # but nothing is published — the project ships git-tag-only for now.
        # To enable PyPI releases later: (1) configure PyPI trusted publishing
        # (OIDC) for this repo's release.yml + the `pypi` Environment, then
        # (2) set PYPI_PUBLISH_ENABLED=true. No workflow edit needed.
        # `inputs.skip_publish` keeps the workflow_dispatch dry-run publish-free.
        if: ${{ inputs.skip_publish != true && vars.PYPI_PUBLISH_ENABLED == 'true' }}
        run: uv publish
