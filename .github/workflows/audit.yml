name: Scheduled audit

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Weekly dependency audit
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = full clone so `gitleaks git` can scan the entire commit
      # history (a secret committed then deleted lives only in history).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false

      - name: Check lockfile consistency
        run: uv lock --check

      # Full-tree audit (includes dev/test deps that run on CI runners), pinned tool.
      - name: Export full lockfile for audit
        # --no-emit-project: exclude the local project (uv exports it as editable
        # `-e .`, which pip-audit cannot install under --require-hashes).
        run: uv export --format requirements-txt --all-extras --no-emit-project > /tmp/requirements-audit-full.txt

      - name: Audit dependencies
        run: uvx pip-audit@2.10.0 -r /tmp/requirements-audit-full.txt

      # OSS-hygiene scanner suite (fold #244). Same invocations as the release audit job,
      # so the weekly run also covers static analysis, license, and secret hygiene.
      - name: Install dependencies (frozen, for license scan)
        run: uv sync --frozen --all-extras

      - name: Static analysis (bandit)
        run: uvx bandit==1.9.4 -r src/

      - name: License compatibility (pip-licenses)
        # Fail on copyleft licenses incompatible with the project's MIT license.
        # --partial-match is REQUIRED: without it --fail-on does case-insensitive EXACT
        # set-membership against the SPDX expression / Trove classifier, which never equals
        # the bare token (e.g. "GPL-3.0-only" != "GPL"), so the gate would silently pass a
        # genuinely GPL/AGPL dependency. --partial-match also flags LGPL via "GPL"
        # (acceptable/conservative for an MIT project).
        #
        # PROJECT-SCOPED via `uv run`, NOT `uvx`: `uvx` runs pip-licenses in an isolated
        # ephemeral venv, so it scans only its OWN ~3 deps — never the project tree — making
        # the gate a vacuous no-op that can never catch a real GPL/AGPL dependency. `uv run`
        # runs it against the synced project environment (verified: 85 packages). The
        # `uv sync --frozen --all-extras` step above is what makes that project env available.
        #
        # docutils WAIVER (--ignore-packages docutils): docutils:0.22.4 carries a GPL Trove
        # classifier, but the ONLY GPL-licensed file in the package is an unused Emacs editor
        # config (rst.el); the package itself is public-domain + BSD and is AGPL-clean (which
        # matters for this network-served MCP). The waiver is per-package and auditable; the
        # --fail-on token set is intentionally NOT broadened. Upstream COPYING:
        # https://docutils.sourceforge.io/COPYING.html
        run: uv run --frozen --with pip-licenses==5.5.5 python -m piplicenses --from=mixed --partial-match --fail-on="GPL;AGPL;SSPL;EUPL" --ignore-packages docutils

      - name: Secret scan (gitleaks)
        # `gitleaks git` scans the full commit HISTORY (requires fetch-depth: 0 on checkout);
        # `gitleaks dir` would only see the current working tree and miss secrets that were
        # committed then deleted in a later commit.
        run: |
          # gitleaks' go.mod declares the canonical module path as
          # github.com/zricethezav/gitleaks; the gitleaks/gitleaks path fails to install.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --redact --exit-code 1
