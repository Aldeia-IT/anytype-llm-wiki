name: Scheduled audit

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Weekly dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false

      - name: Check lockfile consistency
        run: uv lock --check

      # Full-tree audit (includes dev/test deps that run on CI runners), pinned tool.
      - name: Export full lockfile for audit
        run: uv export --format requirements-txt --all-extras > /tmp/requirements-audit-full.txt

      - name: Audit dependencies
        run: uvx pip-audit@2.10.0 -r /tmp/requirements-audit-full.txt

      # OSS-hygiene scanner suite (fold #244). Same invocations as the release audit job,
      # so the weekly run also covers static analysis, license, and secret hygiene.
      - name: Install dependencies (frozen, for license scan)
        run: uv sync --frozen --all-extras

      - name: Static analysis (bandit)
        run: uvx bandit==1.9.4 -r src/

      - name: License compatibility (pip-licenses)
        # Fail on copyleft licenses incompatible with the project's MIT license.
        run: uvx pip-licenses==5.5.5 --from=mixed --fail-on="GPL;AGPL;SSPL;EUPL"

      - name: Secret scan (gitleaks)
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" dir . --redact --exit-code 1
