version: 2
updates:
  # Keep GitHub Actions SHA-pinned references up to date.
  # Dependabot parses the trailing `# vX.Y.Z` comment and bumps both the SHA and comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Keep Python dependencies in uv.lock up to date.
  # No `pip` fallback entry: dependabot/dependabot-core#13426 (uv security-update
  # fallback regression) is resolved, so the `uv` ecosystem covers security updates.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
