[project]
name = "anytype-llm-wiki"
version = "0.1.0"
description = "An Anytype-native LLM wiki combining Karpathy's pattern with Anytype's typed knowledge graph (Objects, Types, Relations)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jan Hendrik Scheufen", email = "j.h.scheufen@gmail.com" }]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.12.0",
]

[project.scripts]
anytype-llm-wiki = "anytype_llm_wiki.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21",
    "pytest-timeout>=2.2",
    "freezegun>=1.5",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anytype_llm_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
