[project]
name = "anytype-llm-wiki"
version = "0.8.0"
description = "An Anytype-native LLM wiki combining Karpathy's pattern with Anytype's typed knowledge graph (Objects, Types, Relations)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jan Hendrik Scheufen", email = "j.h.scheufen@gmail.com" }]
keywords = ["anytype", "mcp", "llm", "knowledge-graph", "rag", "agent-memory", "ollama", "qdrant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Lower bound + next-major upper bound (compatible-release policy): a
    # transitive resolution can't silently cross a major and break the build.
    # See README "Supply-chain posture". Caps sit above the currently-locked
    # versions (fastmcp 3.x, httpx 0.28, qdrant-client 1.x, psutil 7.x).
    "fastmcp>=3.4.2,<4.0.0",
    "httpx>=0.27.0,<1.0",
    "qdrant-client>=1.18.0,<2.0.0",
    "psutil>=5.9,<8.0.0",
    "markdownify>=1.2.2,<1.3.0",
    "pydantic>=2.13.4,<3.0",
]

[project.urls]
Homepage = "https://github.com/Aldeia-IT/anytype-llm-wiki"
Repository = "https://github.com/Aldeia-IT/anytype-llm-wiki"
Issues = "https://github.com/Aldeia-IT/anytype-llm-wiki/issues"
Changelog = "https://github.com/Aldeia-IT/anytype-llm-wiki/blob/main/CHANGELOG.md"

[project.scripts]
anytype-llm-wiki = "anytype_llm_wiki.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "respx>=0.21",
    "pytest-timeout>=2.2",
    "freezegun>=1.5",
    "psutil>=5.9",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anytype_llm_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: marks tests as requiring live Anytype + Qdrant + Ollama services (skip with -m 'not live')",
]
